name: MenuPro operational watchdog
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
    - cron: '0 20,21 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: menupro-operational-watchdog
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions/checkout v6; pin the reviewed implementation, never a moving tag.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check MenuPro operations
        env:
          MENUPRO_MONITOR_TOKEN: ${{ secrets.MENUPRO_MONITOR_TOKEN }}
        run: node scripts/operations-watchdog.mjs
