name: MenuPro hourly maintenance
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: menupro-lifecycle
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run maintenance against Neon
        env:
          MENUPRO_WORKER_SECRET: ${{ secrets.MENUPRO_WORKER_SECRET }}
        run: node scripts/run-lifecycle.mjs
